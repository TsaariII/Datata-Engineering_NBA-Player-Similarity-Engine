services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PW}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  etl:
    build: .
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL}
      - NBA_PER_GAME_CSV=${NBA_PER_GAME_CSV}
      - ETL_YEARS=${ETL_YEARS:-${ETL_YEAR:-2024}}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - ./data:/app/data
    command: >
      sh -c "
        uv run python -m etl.scripts.run_etl --years $$ETL_YEARS &&
        uv run python -m etl.scripts.build_features --years $$ETL_YEARS
      "

  api:
    build: .
    ports:
      - "${PORT:-8555}:8555"
    mem_limit: 2g
    environment:
      - PORT=${PORT:-8555}
      - HOST=${HOST:-0.0.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    volumes:
      - .:/app
    command: ["uv", "run", "uvicorn", "service.main:app", "--host", "0.0.0.0", "--port", "8555"]

  test:
    build: .
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - LOG_LEVEL=${LOG_LEVEL:-WARNING}
    depends_on:
      postgres:
        condition: service_healthy
      etl:
        condition: service_completed_successfully
    volumes:
      - .:/app
    command: >
      sh -c "
        uv run pytest tests/ -m 'not integration' -v --tb=short &&
        uv run pytest tests/ -m integration -v --tb=short
      "

volumes:
  pg_data: