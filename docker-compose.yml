services:
  api:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    ports:
      - "${PORT:-8555}:8555"
    mem_limit: 2g
    environment:
      - PORT=${PORT}
      - HOST=${HOST}
      - LOG_LEVEL=${LOG_LEVEL}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - postgres
    volumes:
      - .:/app

  etl:
    build: .
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - LOG_LEVEL=${LOG_LEVEL}
      - DATABASE_URL=${DATABASE_URL}
      - NBA_PER_GAME_CSV=${NBA_PER_GAME_CSV}
      - ETL_YEAR=${ETL_YEAR}
    depends_on:
      - postgres
    volumes:
      - .:/app
      - ./data:/app/data
    command: ["uv", "run", "python", "-m", "etl.scripts.run_etl", "--year", "${ETL_YEAR:-2024}"]
    profiles: ["etl"]

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PW}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  pg_data: