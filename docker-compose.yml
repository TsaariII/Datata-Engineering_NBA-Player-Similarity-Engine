services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: nba
    volumes:
      - ./data/db:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    ports: ["5432:5432"]

  etl:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/nba
    volumes:
      - ./data:/app/data
    command: ["python", "-m", "etl.scripts.run_etl", "--year", "2024"]

  api:
    build: .
    depends_on: [db]
    environment:
      DATABASE_URL: postgres://app:app@db:5432/nba
    ports: ["8000:8000"]
    command: ["uvicorn", "service.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
