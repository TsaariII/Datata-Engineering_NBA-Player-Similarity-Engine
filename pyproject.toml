[project]
name = "nba-player-similarity-engine"
version = "0.1.0"
description = "ETL + minimal API for NBA player similarity (work-in-progress)"
requires-python = ">=3.11"
dependencies = [
  "requests",
  "beautifulsoup4",
  "pandas",
  "numpy",
  "SQLAlchemy>=2.0",
  "psycopg[binary]",
  "fastapi",
  "uvicorn",
]

[project.scripts]
run-etl = "etl.scripts.run_etl:main"
build-features = "etl.scripts.build_features:main"

[tool.uv]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["etl", "service"]